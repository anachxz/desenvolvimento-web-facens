<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 - Layout</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; }
        .lateral {
            position: relative;
            float: left;
            width: 20%;
            height: 100vh;
            background-color: steelblue;
            padding: 20px;
            color: white;
        }
        .lateral a { display: block; color: white; margin: 15px 0; }
        .principal {
            position: relative;
            float: right;
            width: 80%;
            height: 100vh;
            background-color: aliceblue;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        @media (max-width: 600px) {
            .lateral { width: 30%; }
            .principal { width: 70%; }
        }
    </style>
</head>
<body>
    <div class="lateral">
        <h3>Menu</h3>
        <a href="#inicio">Início</a>
        <a href="#sobre">Sobre</a>
        <a href="#contato">Contato</a>
    </div>
    <div class="principal" id="inicio">
        <div>
            <h1>Bem-vindo ao nosso site!</h1>
            <p>Este é o conteúdo principal da página.</p>
        </div>
    </div>
</body>
</html>
