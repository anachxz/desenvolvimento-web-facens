<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX - Cadastro de Funcionário</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #7bd7d3, #9bbfe7);
            min-height: 100vh;
            margin: 0;
            padding: 25px 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .caixa {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #0002;
            text-align: center;
            width: 340px;
            max-width: 85%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 25px;
        }

        fieldset {
            border: none;
            padding: 0;
            min-width: 0;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        input[readonly] {
            background-color: #f2f2f2;
        }

        button {
            padding: 11px;
            background: #36a953;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #27863e;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #resultado {
            margin-top: 22px;
            font-size: 17px;
        }

        .carregar {
            visibility: hidden;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="caixa">
        <h1>Cadastro de Funcionário</h1>

        <form onsubmit="cadastrarFuncionario(event)">
            <fieldset>
                <p><strong>Dados pessoais</strong></p>

                <label for="nome">Digite seu nome:</label><br><br>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Ex.: Ana Silva"
                    required
                ><br><br>

                <label for="telefone">Digite seu telefone:</label><br><br>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="Ex.: (11) 99999-9999"
                    required
                ><br><br>

                <label for="email">Digite seu email:</label><br><br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Ex.: ana.silva@example.com"
                    required
                ><br><br>

                <label for="cpf">Digite seu CPF:</label><br><br>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="Ex.: 123.456.789-00"
                    required
                ><br><br>

                <label for="rg">Digite seu RG:</label><br><br>
                <input
                    type="text"
                    id="rg"
                    name="rg"
                    placeholder="Ex.: 12.345.678-9"
                    required
                ><br><br>

                <p><strong>Cargo</strong></p>

                <label for="cargo">Selecione o cargo:</label><br><br>
                <select id="cargo" name="cargo" required disabled>
                    <option value="">Selecione...</option>
                </select><br><br>

                <label for="salario">Salário:</label><br><br>
                <input
                    type="text"
                    id="salario"
                    name="salario"
                    readonly
                ><br><br>

                <p><strong>Setor</strong></p>

                <label for="setor">Selecione a sigla do setor:</label><br><br>
                <select id="setor" name="setor" required disabled>
                    <option value="">Selecione...</option>
                </select><br><br>

                <label for="nomeSetor">Nome do setor:</label><br><br>
                <input
                    type="text"
                    id="nomeSetor"
                    name="nomeSetor"
                    readonly
                ><br><br>

                <p><strong>Convênio</strong></p>

                <label for="convenio">Selecione o convênio:</label><br><br>
                <select id="convenio" name="convenio" required disabled>
                    <option value="">Selecione...</option>
                </select><br><br>

                <label for="valorTitular">Valor para titular:</label><br><br>
                <input
                    type="text"
                    id="valorTitular"
                    name="valorTitular"
                    readonly
                ><br><br>

                <label for="valorDependente">
                    Valor para dependente:
                </label><br><br>
                <input
                    type="text"
                    id="valorDependente"
                    name="valorDependente"
                    readonly
                ><br><br>

                <button type="submit" id="botaoCadastrar" disabled>
                    Cadastrar Funcionário
                </button>
            </fieldset>
        </form>

        <p class="carregar">Carregando...</p>
        <div id="resultado" aria-live="polite"></div>
    </div>

    <script src="cadastroAwait.js"></script>
</body>
</html>
